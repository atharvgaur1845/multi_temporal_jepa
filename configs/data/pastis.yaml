# PASTIS dataset config.  Zenodo DOI 10.5281/zenodo.5012942
# NOTE: confirm band ORDER against the official dataloader before trusting these indices.
name: pastis
root: ./data_root/PASTIS          # set after scripts/download_pastis.sh
bands: 10                          # B2,B3,B4,B5,B6,B7,B8,B8A,B11,B12 (resampled to 10 m) — VERIFY ordering
patch_size_px: 128
num_classes: 19                    # 18 crops + background/void (index 0)
ignore_index: 0                    # background/void — decide whether to exclude from mIoU
folds: [1, 2, 3, 4, 5]             # official 5-fold CV
train_folds: [1, 2, 3]
val_folds: [4]
test_folds: [5]

# temporal handling
max_seq_len: 61                    # pad/truncate target for variable-length series (38..61)
date_encoding: doy                 # day-of-year (irregular cadence!) — NOT integer index

# normalization: per-band mean/std — TODO compute from train folds (see data/transforms.py)
norm_mean: null
norm_std: null

# few-shot label fractions for eval
fewshot_fractions: [0.01, 0.05, 0.10]

# Temporal JEPA model + training config.
objective: temporal_jepa           # one of: temporal_jepa | spatial_jepa | mae | byol | simclr
device: cuda                       # SINGLE GPU knob: cuda | cuda:1 | cuda:2 | cpu (or --device)

encoder:
  patch_size: 16                   # 128/16 = 8x8 = 64 tokens/frame  (P=8 -> 256 tokens is an ablation)
  embed_dim: 512                   # ablation grid: {128, 256, 512, 768}
  depth: 6                         # spatial ViT depth
  num_heads: 8                     # head_dim = 512/8 = 64
  temporal_depth: 4                # factorized temporal transformer depth

predictor:
  # MUST be narrower than encoder.embed_dim — the asymmetry bottleneck is half the anti-collapse
  # mechanism. I-JEPA's literal 384 is relative to a ViT-H encoder (1280); the invariant that
  # matters is predictor < encoder. With encoder 512 we use the I-JEPA value 384 (0.75x).
  # build_model auto-clamps if a config ever sets predictor >= encoder.
  embed_dim: 384
  depth: 6                         # ablation grid: {1, 2, 4, 6}
  num_heads: 12                    # head_dim = 384/12 = 32

ema:
  base_momentum: 0.996
  final_momentum: 1.0
  schedule: linear                 # I-JEPA paper = linear ramp

temporal:
  horizon: 1                       # Δ in acquisition steps; horizon study sweeps {1, 2, 4, 8}
  min_context: 4                   # minimum number of past acquisitions in the context

loss:
  type: l2                         # I-JEPA = L2; ablate L1 (V-JEPA)
  target_layernorm: true           # LayerNorm targets before loss
  stop_grad: true                  # MANDATORY on target branch

optim:
  name: adamw
  lr: 1.0e-3
  warmup_epochs: 15
  min_lr: 1.0e-6
  weight_decay_start: 0.04
  weight_decay_end: 0.40
  epochs: 100
  batch_size: 64                   # effective batch via grad_accum on a single GPU
  grad_accum: 4
  amp: true
  augment: true                    # random H/V flips during pretraining (label-free)
  # weight_decay is cosine-ramped weight_decay_start -> weight_decay_end over training.

log:
  diagnostics_every: 50            # steps; ALWAYS pair loss with collapse diagnostics + a probe
  seed: 0
